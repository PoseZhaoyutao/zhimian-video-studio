<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HyperFrames 动效预览 · BERT双任务 · 7月15日</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>
<script>
  gsap.registerPlugin(MotionPathPlugin);
  gsap.config({force3D: true});
</script>
<style>
  :root {
    --bg-deep: #05050a;
    --bg-panel: #0d0d18;
    --bg-card: #161625;
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.15);
    --text: #f5f5fa;
    --text-muted: #7a7a90;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 20%, rgba(255,45,85,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0,212,255,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }
  header h1 {
    font-size: 28px;
    font-weight: 950;
    background: linear-gradient(90deg, #ff2d55, #ffb300, #00d4ff, #ff2d55);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient-shift 4s linear infinite;
    margin-bottom: 6px;
  }
  @keyframes gradient-shift {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  header p { color: var(--text-muted); font-size: 13px; }
  .toolbar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .toolbar button {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
    font-weight: 600;
  }
  .toolbar button:hover {
    border-color: var(--border-strong);
    background: #20202f;
    transform: translateY(-1px);
  }
  .toolbar button.active {
    border-color: #ff2d55;
    background: rgba(255,45,85,0.15);
    box-shadow: 0 0 12px rgba(255,45,85,0.3);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    max-width: 1500px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .scene-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .scene-card:hover {
    border-color: rgba(0,212,255,0.3);
    box-shadow: 0 4px 20px rgba(0,212,255,0.1);
  }
  .scene-header {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .scene-header .label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 2px;
  }
  .scene-header .title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }
  .style-tabs {
    display: flex;
    gap: 2px;
    background: var(--bg-deep);
    padding: 3px;
    border-radius: 7px;
  }
  .style-tab {
    padding: 4px 8px;
    font-size: 10px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    font-weight: 600;
  }
  .style-tab:hover { color: var(--text); }
  .style-tab.active {
    background: var(--bg-card);
    color: var(--text);
  }
  .preview-frame {
    width: 100%;
    aspect-ratio: 9/16;
    max-height: 500px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    perspective: 800px;
  }
  .scene-footer {
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
  }
  .scene-footer .replay {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .scene-footer .replay:hover {
    color: var(--text);
    border-color: var(--border-strong);
  }
  .scene-footer .selected-style {
    font-size: 11px;
    color: #00d4ff;
    font-weight: 600;
  }
  .save-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 100;
  }
  .save-bar button {
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
  }
  .save-bar .save-btn {
    background: linear-gradient(135deg, #ff2d55, #ff6b35);
    color: #fff;
    box-shadow: 0 4px 20px rgba(255,45,85,0.4);
  }
  .save-bar .save-btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 8px 30px rgba(255,45,85,0.6);
  }

  /* ═══ 预览内容通用样式 ═══ */
  .preview-content {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    transform-style: preserve-3d;
  }
  .flow-field {
    position: absolute;
    inset: -30%;
    pointer-events: none;
    mix-blend-mode: screen;
    filter: blur(80px);
    z-index: 0;
  }
  .flow-field-2 {
    position: absolute;
    inset: -40%;
    pointer-events: none;
    mix-blend-mode: screen;
    filter: blur(100px);
    z-index: 0;
    opacity: 0.5;
  }
  .scan-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    opacity: 0.08;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.5) 2px, rgba(0,0,0,0.5) 4px);
  }
  .noise-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 8;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
  }
  .grid-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image: 
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .grid-bg-far {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image: 
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: translateZ(-50px);
  }
  .orbital-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 200px;
    height: 200px;
    margin: -100px 0 0 -100px;
    border: 1px solid;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.2;
  }
  .orbital-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
  }
  .ambient-particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
  }
  .shimmer-text {
    background: linear-gradient(90deg, currentColor 0%, currentColor 40%, #fff 50%, currentColor 60%, currentColor 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .light-ray {
    position: absolute;
    top: -20%;
    width: 2px;
    height: 140%;
    pointer-events: none;
    z-index: 3;
    opacity: 0.2;
    filter: blur(2px);
  }
  .big-number {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 72px;
    font-weight: 950;
    line-height: 1;
    letter-spacing: -3px;
    z-index: 2;
  }
  .subtitle {
    position: absolute;
    top: 28%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    z-index: 2;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .headline {
    position: absolute;
    top: 14%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    font-weight: 900;
    z-index: 2;
    text-align: center;
    width: 80%;
    line-height: 1.3;
  }
  .compare-cards {
    position: absolute;
    top: 38%;
    left: 6%;
    right: 6%;
    display: flex;
    gap: 10px;
    z-index: 2;
  }
  .compare-card {
    flex: 1;
    border-radius: 12px;
    padding: 16px 8px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .compare-card .card-label {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .compare-card .card-icon {
    font-size: 36px;
    font-weight: 950;
  }
  .compare-card .card-sub {
    font-size: 10px;
    margin-top: 8px;
    opacity: 0.7;
    line-height: 1.4;
  }
  .flow-steps {
    position: absolute;
    top: 36%;
    left: 6%;
    right: 6%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 2;
  }
  .flow-step {
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .flow-step .step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 12px;
    flex-shrink: 0;
  }
  .flow-step .step-text {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
  }
  .energy-line {
    position: absolute;
    left: 20px;
    width: 2px;
    pointer-events: none;
    z-index: 3;
    opacity: 0;
  }
  .formula-row {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 2;
    width: 80%;
  }
  .formula-token {
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .code-card {
    position: absolute;
    top: 38%;
    left: 6%;
    right: 6%;
    border-radius: 10px;
    padding: 14px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 13px;
    z-index: 2;
    line-height: 1.8;
    position: relative;
    overflow: hidden;
  }
  .code-line {
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-all;
    font-weight: 600;
  }
  .cursor-block {
    display: inline-block;
    width: 7px;
    height: 14px;
    vertical-align: middle;
    margin-left: 2px;
  }
  .scan-line-beam {
    position: absolute;
    left: 0; right: 0;
    height: 30px;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
  }
  .process-steps {
    position: absolute;
    top: 36%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 2;
  }
  .process-step {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 950;
    position: relative;
  }
  .process-label {
    font-size: 13px;
    font-weight: 700;
    margin-top: 2px;
    text-align: center;
    max-width: 220px;
    line-height: 1.4;
  }
  .process-arrow {
    width: 2px;
    height: 16px;
    position: relative;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
  }
  .pulse-ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
  }
  .glitch-bar {
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
    z-index: 6;
  }
  .shockwave {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
  }
  .spark {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
  }
  .counter {
    font-variant-numeric: tabular-nums;
    font-weight: 950;
  }

  /* ═══ 引用文献栏 ═══ */
  .ref-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 6px 10px;
    z-index: 7;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  }
  .ref-chip {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
    line-height: 1.4;
    border: 1px solid;
  }
  .ref-chip a {
    text-decoration: none;
    color: inherit;
  }

  /* ═══ 场景解说文字 ═══ */
  .scene-caption {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 600;
    z-index: 6;
    text-align: center;
    width: 86%;
    line-height: 1.5;
    padding: 5px 12px;
    border-radius: 8px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(4px);
  }

  /* 风格变体 */
  [data-style="dark-neon"] {
    background: linear-gradient(135deg, #080810 0%, #10101e 50%, #0a0a15 100%);
    color: #f5f5fa;
  }
  [data-style="dark-neon"] .flow-field {
    background: conic-gradient(from 0deg at 50% 50%,
      rgba(255,45,85,0.4), rgba(0,212,255,0.3), rgba(255,179,0,0.2), rgba(255,45,85,0.4));
    opacity: 0.4;
  }
  [data-style="dark-neon"] .flow-field-2 {
    background: radial-gradient(circle at 30% 70%, rgba(255,45,85,0.25), transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(0,212,255,0.25), transparent 50%);
  }
  [data-style="dark-neon"] .orbital-ring { border-color: rgba(255,45,85,0.3); }
  [data-style="dark-neon"] .orbital-dot { background: #00d4ff; box-shadow: 0 0 10px #00d4ff; }
  [data-style="dark-neon"] .grid-bg { display: block; }
  [data-style="dark-neon"] .big-number { color: #f5f5fa; text-shadow: 0 0 40px #ff2d55, 0 0 80px #ff2d55; }
  [data-style="dark-neon"] .headline { color: #f5f5fa; text-shadow: 0 0 20px #ff2d55; }
  [data-style="dark-neon"] .subtitle { color: rgba(245,245,250,0.5); }
  [data-style="dark-neon"] .light-ray { background: linear-gradient(to bottom, transparent, #ff2d55, transparent); }
  [data-style="dark-neon"] .compare-card { background: rgba(20,20,28,0.8); backdrop-filter: blur(4px); }
  [data-style="dark-neon"] .compare-card.lose { border: 2px solid #ff2d55; box-shadow: 0 0 20px rgba(255,45,85,0.3), inset 0 0 20px rgba(255,45,85,0.05); }
  [data-style="dark-neon"] .compare-card.win { border: 2px solid #00d4ff; box-shadow: 0 0 25px rgba(0,212,255,0.4), inset 0 0 20px rgba(0,212,255,0.05); }
  [data-style="dark-neon"] .compare-card.lose .card-label { color: #ff2d55; }
  [data-style="dark-neon"] .compare-card.win .card-label { color: #00d4ff; }
  [data-style="dark-neon"] .compare-card.lose .card-icon { color: #ff2d55; text-shadow: 0 0 20px #ff2d55; }
  [data-style="dark-neon"] .compare-card.win .card-icon { color: #00d4ff; text-shadow: 0 0 20px #00d4ff; }
  [data-style="dark-neon"] .flow-step { background: rgba(255,255,255,0.04); border: 1.5px solid rgba(0,212,255,0.25); }
  [data-style="dark-neon"] .flow-step.active { border-color: #ff2d55; box-shadow: 0 0 20px rgba(255,45,85,0.4), inset 0 0 15px rgba(255,45,85,0.05); }
  [data-style="dark-neon"] .flow-step .step-num { background: #ff2d55; color: #fff; box-shadow: 0 0 15px #ff2d55; }
  [data-style="dark-neon"] .flow-step .step-text { color: #f5f5fa; }
  [data-style="dark-neon"] .energy-line { background: linear-gradient(to bottom, #ff2d55, #00d4ff); }
  [data-style="dark-neon"] .formula-token { background: rgba(0,212,255,0.1); border: 1.5px solid rgba(0,212,255,0.35); color: #f5f5fa; }
  [data-style="dark-neon"] .formula-token.highlight { background: rgba(255,179,0,0.15); border-color: #ffb300; color: #ffb300; box-shadow: 0 0 20px rgba(255,179,0,0.3); }
  [data-style="dark-neon"] .code-card { background: #08080f; border: 1.5px solid rgba(0,212,255,0.25); box-shadow: 0 0 15px rgba(0,212,255,0.15); color: #00ff88; }
  [data-style="dark-neon"] .scan-line-beam { background: linear-gradient(to bottom, transparent, rgba(0,255,136,0.3), transparent); }
  [data-style="dark-neon"] .process-step { background: rgba(20,20,28,0.8); border: 2px solid #ff2d55; color: #ff2d55; }
  [data-style="dark-neon"] .process-step.active { background: #ff2d55; color: #fff; box-shadow: 0 0 25px rgba(255,45,85,0.7); }
  [data-style="dark-neon"] .process-label { color: #f5f5fa; }
  [data-style="dark-neon"] .process-arrow { background: linear-gradient(to bottom, #ff2d55, #00d4ff); }
  [data-style="dark-neon"] .shockwave { border: 2px solid #ff2d55; }
  [data-style="dark-neon"] .ambient-particle { background: #00d4ff; box-shadow: 0 0 6px #00d4ff; }

  [data-style="cream-editorial"] {
    background: linear-gradient(135deg, #f4efe4 0%, #fffdf7 50%, #f4efe4 100%);
    color: #151515;
  }
  [data-style="cream-editorial"] .flow-field {
    background: conic-gradient(from 0deg at 50% 50%,
      rgba(232,63,50,0.1), rgba(38,92,255,0.08), rgba(232,63,50,0.06), rgba(232,63,50,0.1));
    opacity: 0.4;
  }
  [data-style="cream-editorial"] .flow-field-2 {
    background: radial-gradient(circle at 30% 70%, rgba(232,63,50,0.08), transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(38,92,255,0.06), transparent 50%);
  }
  [data-style="cream-editorial"] .orbital-ring { border-color: rgba(232,63,50,0.15); }
  [data-style="cream-editorial"] .orbital-dot { background: #265cff; }
  [data-style="cream-editorial"] .scan-lines, [data-style="cream-editorial"] .noise-overlay { display: none; }
  [data-style="cream-editorial"] .grid-bg {
    background-image: 
      linear-gradient(rgba(21,21,21,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(21,21,21,0.03) 1px, transparent 1px);
  }
  [data-style="cream-editorial"] .big-number { color: #151515; }
  [data-style="cream-editorial"] .headline { color: #151515; }
  [data-style="cream-editorial"] .subtitle { color: #817b72; }
  [data-style="cream-editorial"] .light-ray { background: linear-gradient(to bottom, transparent, #e83f32, transparent); opacity: 0.1; }

function getAccentColor(style, variant) {
  const map = {
    "premium": { primary: "#6366f1", secondary: "#818cf8", accent: "#c084fc", success: "#22d3ee" },
    "dark-neon": { primary: "#ff2d55", secondary: "#00d4ff", accent: "#ffb300", success: "#00ff88" },
    "cream-editorial": { primary: "#e83f32", secondary: "#265cff", accent: "#d4a574", success: "#265cff" },
    "ref-comparison": { primary: "#e63946", secondary: "#265cff", accent: "#ffb703", success: "#265cff" },
    "tech-glow": { primary: "#00ff88", secondary: "#00d4ff", accent: "#ff6b6b", success: "#00ff88" },
  };
  return map[style][variant] || map[style].primary;
}

function spawnAmbientParticles(container, sceneId, style, count) {
  const prefix = `#preview-${sceneId}`;
  const color = getAccentColor(style, "secondary");
  for (let i = 0; i < count; i++) {
    const p = document.createElement("div");
    p.className = "ambient-particle";
    p.id = `amb-${sceneId}-${i}`;
    container.appendChild(p);
    const size = 1.5 + Math.random() * 2.5;
    const startX = Math.random() * 100;
    const startY = 60 + Math.random() * 40;
    const drift = (Math.random() - 0.5) * 60;
    gsap.set(p, {
      left: startX + "%",
      top: startY + "%",
      width: size,
      height: size,
      opacity: 0,
      backgroundColor: color,
      boxShadow: `0 0 ${size * 2}px ${color}`,
    });
    gsap.to(p, {
      y: "-=80",
      x: "+=" + drift,
      opacity: 0.6,
      duration: 2 + Math.random() * 2,
      ease: "power1.out",
      delay: Math.random() * 2,
      repeat: 6,
      repeatDelay: 0.5,
    });
    gsap.to(p, {
      opacity: 0,
      duration: 1,
      ease: "power1.in",
      delay: 1 + Math.random() * 2,
      repeat: 6,
      repeatDelay: 1.5,
    });
  }
}

function spawnSparks(container, sceneId, style, count, centerX, centerY) {
  const color = getAccentColor(style, "accent");
  for (let i = 0; i < count; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.id = `spk-${sceneId}-${i}`;
    container.appendChild(s);
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
    const dist = 30 + Math.random() * 60;
    const endX = Math.cos(angle) * dist;
    const endY = Math.sin(angle) * dist;
    gsap.set(s, {
      left: centerX,
      top: centerY,
      width: 2 + Math.random() * 3,
      height: 2 + Math.random() * 3,
      backgroundColor: color,
      boxShadow: `0 0 6px ${color}`,
      xPercent: -50,
      yPercent: -50,
    });
    gsap.fromTo(s,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 0.9, duration: 0.15, ease: "power2.out", delay: 0.02 * i }
    );
    gsap.to(s, {
      x: endX + "px",
      y: endY + "px",
      opacity: 0,
      duration: 0.6 + Math.random() * 0.4,
      ease: "power2.out",
      delay: 0.02 * i,
    });
  }
}

function renderPreview(sceneId, style) {

    <div class="flow-field-2"></div>

    content += `<div class="orbital-ring" id="oring-${sceneId}-${r}"></div>`;
    content += `<div class="orbital-dot" id="odot-${sceneId}-${r}"></div>`;

  for (let r = 0; r < 3; r++) {
    content += `<div class="light-ray" id="ray-${sceneId}-${r}"></div>`;

    content += `<div class="glitch-bar" id="glitch-${sceneId}"></div>`;

    }
    for (let i = 0; i < 5; i++) {
      content += `<div class="connect-line" id="cline-${sceneId}-${i}"></div>`;
    }
  }

  if (scene.visualType === "comparison") {
    const d = scene.data;
    content += `
      <div class="headline shimmer-text" id="head-${sceneId}">${d.bigNum}</div>
      <div class="subtitle" id="sub-${sceneId}">${d.subtitle}</div>
      <div class="compare-cards">
        <div class="compare-card lose" id="card-l-${sceneId}">
          <div class="card-label">${d.left.replace(/\n/g, '<br>')}</div>
          <div class="card-icon">✕</div>
        </div>
        <div class="compare-card win" id="card-r-${sceneId}">
          <div class="card-label">${d.right.replace(/\n/g, '<br>')}</div>
          <div class="card-icon">✓</div>
        </div>
      </div>
    `;
    for (let i = 0; i < 20; i++) {
      content += `<div class="particle" id="p-${sceneId}-${i}"></div>`;
    }
    for (let i = 0; i < 3; i++) {
      content += `<div class="pulse-ring" id="pr-${sceneId}-${i}"></div>`;
    }
  } else if (scene.visualType === "flow") {
    const d = scene.data;
    content += `<div class="subtitle shimmer-text" id="sub-${sceneId}">${d.subtitle}</div>`;
    content += `<div class="energy-line" id="eline-${sceneId}"></div>`;
    content += `<div class="flow-steps">`;
    d.steps.forEach((step, i) => {
      content += `<div class="flow-step" id="step-${sceneId}-${i}"><div class="step-num">${i+1}</div><div class="step-text">${step}</div></div>`;
    });
    content += `</div>`;
    for (let i = 0; i < 8; i++) {
      content += `<div class="particle" id="fp-${sceneId}-${i}"></div>`;
    }
  } else if (scene.visualType === "formula") {
    const d = scene.data;
    content += `<div class="subtitle shimmer-text" id="sub-${sceneId}">${d.subtitle}</div>`;
    content += `<div class="formula-row">`;
    d.tokens.forEach((token, i) => {
      const isHighlight = i === d.tokens.length - 1;
      content += `<div class="formula-token ${isHighlight ? 'highlight' : ''}" id="tok-${sceneId}-${i}">${token}</div>`;
    });
    content += `</div>`;
    for (let i = 0; i < 12; i++) {
      content += `<div class="particle" id="tp-${sceneId}-${i}"></div>`;
    }
  } else if (scene.visualType === "code") {
    const d = scene.data;
    content += `<div class="subtitle shimmer-text" id="sub-${sceneId}">${d.subtitle}</div>`;
    content += `<div class="scan-line-beam" id="scanbeam-${sceneId}"></div>`;
    content += `<div class="code-card" id="code-${sceneId}">`;
    d.code.forEach((line, i) => {
      content += `<div class="code-line" id="code-line-${sceneId}-${i}">${line}</div>`;
    });

    const d = scene.data;
    content += `<div class="subtitle shimmer-text" id="sub-${sceneId}">${d.subtitle}</div>`;

    d.steps.forEach((step, i) => {
      content += `<div class="process-step" id="pstep-${sceneId}-${i}"><span class="counter" id="pcount-${sceneId}-${i}">${i+1}</span></div>`;
      content += `<div class="process-label" id="plabel-${sceneId}-${i}">${step}</div>`;
      if (i < d.steps.length - 1) {
        content += `<div class="process-arrow" id="parrow-${sceneId}-${i}"></div>`;

  // 场景解说文字
  if (scene.caption) {
    content += `<div class="scene-caption" id="caption-${sceneId}">${scene.caption}</div>`;

  if (scene.refs && scene.refs.length) {
    content += `<div class="ref-bar" id="refbar-${sceneId}">`;

  content += `</div>`;
  frame.innerHTML = content;
  playAnimation(sceneId, style);
}

function playAnimation(sceneId, style) {
  const scene = SCENES.find(s => s.id === sceneId);
  const prefix = `#preview-${sceneId}`;
  const container = document.querySelector(`${prefix} .preview-content`);

  gsap.killTweensOf(`${prefix} *`);
  gsap.killTweensOf(container);

  // ═══ 镜头缓慢推近 ═══
  gsap.fromTo(container,
    { scale: 0.94, opacity: 0.6 },
    { scale: 1, opacity: 1, duration: 2.5, ease: "power2.inOut" }
  );

  // ═══ FlowField - 极慢旋转 + 呼吸 ═══
  const ff = document.querySelector(`${prefix} .flow-field`);
  if (ff) {
    gsap.fromTo(ff,
      { rotation: -20, scale: 0.8, opacity: 0 },
      { rotation: 0, scale: 1, opacity: 1, duration: 2, ease: "power2.inOut" }
    );
    gsap.to(ff, { rotation: "+=360", duration: 40, ease: "none", repeat: 3, delay: 1.5 });
    gsap.to(ff, { scale: 1.08, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 4, delay: 1.5 });
  }

  // FlowField 2 - 反向极慢旋转
  const ff2 = document.querySelector(`${prefix} .flow-field-2`);
  if (ff2) {
    gsap.fromTo(ff2, { rotation: 20, opacity: 0 }, { rotation: 0, opacity: 0.6, duration: 2.5, ease: "power2.inOut", delay: 0.3 });
    gsap.to(ff2, { rotation: "-=360", duration: 60, ease: "none", repeat: 3, delay: 1.5 });
    gsap.to(ff2, { scale: 0.95, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 3, delay: 0.8 });
  }

  // ═══ 网格背景 - 极慢视差 ═══
  const gridBg = document.querySelector(`${prefix} .grid-bg`);
  const gridBgFar = document.querySelector(`${prefix} .grid-bg-far`);
  if (gridBg) {
    gsap.fromTo(gridBg, { opacity: 0 }, { opacity: 1, duration: 1.5, ease: "power2.inOut", delay: 0.3 });
    gsap.to(gridBg, { backgroundPosition: "40px 40px", duration: 30, ease: "none", repeat: 3 });
  }
  if (gridBgFar) {
    gsap.fromTo(gridBgFar, { opacity: 0 }, { opacity: 1, duration: 2, ease: "power2.inOut", delay: 0.2 });
    gsap.to(gridBgFar, { backgroundPosition: "-80px -80px", duration: 60, ease: "none", repeat: 3 });
  }

  // ═══ 轨道环 - 极慢旋转 + 柔和淡入 ═══
  const ringColors = {
    "premium": ["#6366f1", "#a855f7"],
    "dark-neon": ["#ff2d55", "#00d4ff"],
    "cream-editorial": ["#e83f32", "#265cff"],
    "ref-comparison": ["#e63946", "#265cff"],
    "tech-glow": ["#00ff88", "#00d4ff"],
  };
  for (let r = 0; r < 2; r++) {
    const ring = document.querySelector(`#oring-${sceneId}-${r}`);
    const dot = document.querySelector(`#odot-${sceneId}-${r}`);
    const rx = r === 0 ? 90 : 130;
    const ry = r === 0 ? 28 : 40;
    const color = ringColors[style][r % 2];
    if (ring) {
      gsap.set(ring, {
        left: "50%", top: "50%",
        width: rx * 2, height: ry * 2,
        xPercent: -50, yPercent: -50,
        borderColor: color + "22",
        borderRadius: "50%",
        opacity: 0,
      });
      gsap.to(ring, { opacity: r === 0 ? 0.2 : 0.15, duration: 2, ease: "power2.inOut", delay: 0.5 + r * 0.3 });
      gsap.to(ring, { rotation: 360, duration: r === 0 ? 35 : 50, ease: "none", repeat: 3, delay: 1, transformOrigin: "center center" });
    }
    if (dot) {
      gsap.set(dot, {
        left: "50%", top: "50%",
        xPercent: -50, yPercent: -50,
        backgroundColor: color,
        boxShadow: `0 0 6px ${color}80`,
        opacity: 0,
      });
      gsap.to(dot, { opacity: 0.6, duration: 0.8, ease: "power2.inOut", delay: 0.8 + r * 0.3 });
      const dur = r === 0 ? 35 : 50;
      const angleProxy = { angle: 0 };
      gsap.to(angleProxy, {
        angle: Math.PI * 2,
        duration: dur,
        ease: "none",
        repeat: 3,
        delay: 0.8 + r * 0.3,
        onUpdate: function() {
          const a = angleProxy.angle + r * 1.2;
          gsap.set(dot, {
            x: Math.cos(a) * rx,
            y: Math.sin(a) * ry,
            scale: 0.5 + (Math.sin(a) + 1) * 0.35,
          });
        }
      });
    }
  }

  // ═══ 光线 - 柔和淡入 + 缓慢漂浮 ═══
  for (let r = 0; r < 3; r++) {
    const ray = document.querySelector(`#ray-${sceneId}-${r}`);
    if (ray) {
      gsap.set(ray, {
        left: 15 + r * 30 + "%",
        rotation: -15 + r * 5,
        opacity: 0,
      });
      gsap.to(ray, {
        opacity: style === "cream-editorial" ? 0.05 : style === "premium" ? 0.10 : 0.12,
        duration: 2,
        ease: "power2.inOut",
        delay: 0.8 + r * 0.2,
      });
      gsap.to(ray, {
        y: "+=20",
        x: "+=8",
        duration: 6 + r,
        ease: "sine.inOut",
        yoyo: true,
        repeat: 3,
        delay: 1 + r * 0.3,
      });
    }
  }

  // ═══ 震屏冲击波 - premium改为柔和光圈扩散 ═══
  const shock = document.querySelector(`#shock-${sceneId}`);
  if (shock) {
    gsap.set(shock, { left: "50%", top: "45%" });
    if (style === "premium") {
      // 柔和光圈扩散
      const shockTl = gsap.timeline({ repeat: 1, repeatDelay: 3, delay: 0.8 });
      shockTl.fromTo(shock,
        { scale: 0, opacity: 0.4, borderWidth: 1 },
        { scale: 20, opacity: 0, borderWidth: 0.5, duration: 2.5, ease: "power2.out" }
      );
    } else {
      const shockTl = gsap.timeline({ repeat: 2, repeatDelay: 2, delay: 0.3 });
      shockTl.fromTo(shock,
        { scale: 0, opacity: 0.8, borderWidth: 3 },
        { scale: 15, opacity: 0, borderWidth: 1, duration: 0.8, ease: "power2.out" }
      );
    }
  }

  // ═══ 环境粒子 - 柔和上浮 ═══
  spawnAmbientParticles(container, sceneId, style, 10);

  // ═══ premium: 移除震屏，改为轻微景深呼吸 ═══
  if (style !== "premium") {
    gsap.fromTo(container, { x: 0, y: 0 }, {
      x: "random(-3, 3)",
      y: "random(-2, 2)",
      duration: 0.05,
      repeat: 8,
      yoyo: true,
      ease: "none",
      delay: 0.3,
    });
  }

  if (scene.visualType === "comparison") {
    const head = document.querySelector(`#head-${sceneId}`);
    const sub = document.querySelector(`#sub-${sceneId}`);
    const cardL = document.querySelector(`#card-l-${sceneId}`);
    const cardR = document.querySelector(`#card-r-${sceneId}`);
    const winColor = getAccentColor(style, "secondary");

    // ═══ 大标题 - 柔和缩放淡入 + 持续呼吸 + shimmer ═══
    if (head) {
      gsap.fromTo(head,
        { scale: 0.85, opacity: 0, y: -15 },
        { scale: 1, opacity: 1, y: 0, duration: 1.5, ease: "power3.inOut", delay: 0.4 }
      );
      // shimmer流光 - 缓慢
      gsap.to(head, { backgroundPosition: "-200% 0%", duration: 4, ease: "sine.inOut", repeat: 3, delay: 1.5 });
      // 持续呼吸浮动 - 极轻微
      gsap.to(head, { y: "+=4", duration: 4, ease: "sine.inOut", yoyo: true, repeat: 4, delay: 1.5 });
      // 发光呼吸
      if (style === "premium") {
        gsap.to(head, { textShadow: "0 0 40px rgba(99,102,241,0.5), 0 0 80px rgba(99,102,241,0.3)", duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 4, delay: 1.5 });
      } else if (style === "dark-neon" || style === "tech-glow") {
        gsap.to(head, { textShadow: "0 0 60px currentColor, 0 0 120px currentColor", duration: 2, ease: "sine.inOut", yoyo: true, repeat: 4, delay: 1.5 });
      }
    }
    if (sub) gsap.fromTo(sub, { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "power2.inOut", delay: 1 });

    // ═══ 左卡 - 柔和滑入 + 缩放 + 持续浮动 ═══
    if (cardL) {
      gsap.fromTo(cardL,
        { x: -80, opacity: 0, scale: 0.92 },
        { x: 0, opacity: 1, scale: 1, duration: 1.2, ease: "power3.inOut", delay: 1.3 }
      );
      // 持续呼吸浮动
      gsap.to(cardL, { y: "+=6", duration: 4, ease: "sine.inOut", yoyo: true, repeat: 3, delay: 2.5 });
    }
    // ═══ 右卡 - 柔和滑入 + 光晕呼吸 ═══
    if (cardR) {
      gsap.fromTo(cardR,
        { x: 80, opacity: 0, scale: 0.92 },
        { x: 0, opacity: 1, scale: 1, duration: 1.3, ease: "power3.inOut", delay: 1.5 }
      );
      // 持续呼吸
      gsap.to(cardR, { y: "+=5", duration: 4.5, ease: "sine.inOut", yoyo: true, repeat: 3, delay: 2.8 });
      gsap.to(cardR, { scale: 1.015, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 3, delay: 2.8 });
      // 光晕呼吸
      if (style === "premium") {
        gsap.to(cardR, { boxShadow: `0 0 40px rgba(99,102,241,0.3)`, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 4, delay: 2.8 });
      } else if (style === "dark-neon" || style === "tech-glow" || style === "ref-comparison") {
        gsap.to(cardR, { boxShadow: `0 0 50px ${winColor}80`, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 4, delay: 2.8 });
      }
    }

    // ═══ 粒子 - 沿弧线路径流动（非爆发） ═══
    for (let i = 0; i < 20; i++) {
      const p = document.querySelector(`#p-${sceneId}-${i}`);
      if (p) {
        const angle = (i / 20) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
        const dist = 40 + Math.random() * 80;
        const endX = Math.cos(angle) * dist;
        const endY = Math.sin(angle) * dist;
        const size = 2 + Math.random() * 3;
        const color = i % 2 === 0 ? getAccentColor(style, "primary") : getAccentColor(style, "secondary");
        gsap.set(p, {
          left: "50%", top: "55%",
          width: size, height: size,
          backgroundColor: color,
          boxShadow: `0 0 ${size*2}px ${color}80`,
          xPercent: -50, yPercent: -50,
        });
        // 柔和扩散 - sine缓动
        gsap.fromTo(p,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 0.6, duration: 0.8, ease: "power2.inOut", delay: 1.8 + i * 0.04 }
        );
        gsap.to(p, {
          x: endX + "px", y: endY + "px",
          opacity: 0,
          scale: 0.3,
          duration: 2 + Math.random() * 1,
          ease: "sine.inOut",
          delay: 1.8 + i * 0.04,
        });
      }
    }

    // ═══ 脉冲环 - 柔和扩散 ═══
    for (let i = 0; i < 3; i++) {
      const pr = document.querySelector(`#pr-${sceneId}-${i}`);
      if (pr) {
        gsap.set(pr, {
          left: "65%", top: "55%",
          width: 30, height: 30,
          xPercent: -50, yPercent: -50,
          border: `1px solid ${winColor}80`,
          opacity: 0,
          borderRadius: "50%",
        });
        gsap.fromTo(pr,
          { scale: 0.3, opacity: 0.5 },
          { scale: 12, opacity: 0, duration: 2.5, ease: "power2.out", delay: 2.5 + i * 0.8 }
        );
      }
    }

    // ═══ premium: 节点光晕 ═══
    if (style === "premium") {
      for (let i = 0; i < 4; i++) {
        const glow = document.querySelector(`#nglow-${sceneId}-${i}`);
        if (glow) {
          const isLeft = i < 2;
          const xPct = isLeft ? 25 : 75;
          const yPct = 45 + (i % 2) * 10;
          const color = isLeft ? "#a855f7" : "#6366f1";
          gsap.set(glow, {
            left: xPct + "%", top: yPct + "%",
            width: 80, height: 80,
            xPercent: -50, yPercent: -50,
            backgroundColor: color,
          });
          gsap.to(glow, { opacity: 0.15, duration: 2, ease: "power2.inOut", delay: 1.5 + i * 0.2 });
          gsap.to(glow, { scale: 1.3, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 3, delay: 2 + i * 0.2 });
        }
      }
    }

  } else if (scene.visualType === "flow") {
    const sub = document.querySelector(`#sub-${sceneId}`);
    if (sub) {
      gsap.fromTo(sub, { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "power2.inOut", delay: 0.3 });
      gsap.to(sub, { backgroundPosition: "-200% 0%", duration: 4, ease: "sine.inOut", repeat: 3, delay: 1 });
    }

    // ═══ 能量线 - 沿路径自然生长 ═══
    const eline = document.querySelector(`#eline-${sceneId}`);
    if (eline) {
      gsap.set(eline, { top: "42%", height: 0, opacity: 0 });
      gsap.to(eline, { height: "40%", opacity: 0.5, duration: 2, ease: "power2.inOut", delay: 0.8 });
      // 持续呼吸
      gsap.to(eline, { opacity: 0.3, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 3, delay: 2.8 });
    }

    // ═══ premium: 连接线生长 ═══
    if (style === "premium") {
      for (let i = 0; i < 4; i++) {
        const cline = document.querySelector(`#cline-${sceneId}-${i}`);
        if (cline) {
          gsap.set(cline, {
            left: "50%",
            top: `${36 + i * 12}%`,
            height: 0,
            opacity: 0,
          });
          gsap.to(cline, { height: 12, opacity: 0.4, duration: 0.8, ease: "power2.inOut", delay: 1.2 + i * 0.5 });
        }
      }
    }

    scene.data.steps.forEach((_, i) => {
      const step = document.querySelector(`#step-${sceneId}-${i}`);
      if (step) {
        const delay = 0.8 + i * 0.35;
        // ═══ 柔和滑入 + 缩放渐变 ═══
        gsap.fromTo(step,
          { x: -50, opacity: 0, scale: 0.95 },
          { x: 0, opacity: 1, scale: 1, duration: 1, ease: "power3.inOut", delay }
        );
        // 激活高亮 - 柔和过渡
        gsap.to(step, { className: "+=active", duration: 0.6, ease: "power2.inOut", delay: delay + 0.6 });
        gsap.to(step, { className: "-=active", duration: 0.6, ease: "power2.inOut", delay: delay + 2 });
        // 持续呼吸浮动 - 极轻微
        gsap.to(step, { y: "+=4", duration: 3.5 + i * 0.2, ease: "sine.inOut", yoyo: true, repeat: 3, delay: delay + 0.5 });
      }
    });

    // ═══ 粒子沿路径有序流动 ═══
    for (let i = 0; i < 8; i++) {
      const p = document.querySelector(`#fp-${sceneId}-${i}`);
      if (p) {
        const color = getAccentColor(style, i % 2 === 0 ? "primary" : "secondary");
        gsap.set(p, {
          left: "8%",
          top: `${42 + i * 5}%`,
          width: 3, height: 3,
          backgroundColor: color,
          boxShadow: `0 0 6px ${color}80`,
          opacity: 0,
        });
        // 沿水平路径流动 - sine缓动
        gsap.to(p, {
          x: "280%",
          opacity: 0.5,
          duration: 3 + Math.random() * 1.5,
          ease: "sine.inOut",
          delay: 1.5 + i * 0.3,
          repeat: 2,
          repeatDelay: 1,
        });
        gsap.to(p, {
          opacity: 0,
          duration: 1,
          ease: "sine.inOut",
          delay: 2.5 + i * 0.3,
          repeat: 2,
          repeatDelay: 2,
        });
      }
    }

  } else if (scene.visualType === "formula") {
    const sub = document.querySelector(`#sub-${sceneId}`);
    if (sub) {
      gsap.fromTo(sub, { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "power2.inOut", delay: 0.3 });
      gsap.to(sub, { backgroundPosition: "-200% 0%", duration: 4, ease: "sine.inOut", repeat: 3, delay: 1 });
    }

    // ═══ 公式token - 逐步出现 + 清晰节奏 ═══
    scene.data.tokens.forEach((token, i) => {
      const tok = document.querySelector(`#tok-${sceneId}-${i}`);
      if (tok) {
        const delay = 0.8 + i * 0.4;
        // 柔和缩放 + 位移 + 透明度渐变
        gsap.fromTo(tok,
          { scale: 0.85, opacity: 0, y: 30 },
          { scale: 1, opacity: 1, y: 0, duration: 1.2, ease: "power3.inOut", delay }
        );
        // 最后一项持续柔和发光
        if (i === scene.data.tokens.length - 1) {
          if (style === "premium") {
            gsap.to(tok, { boxShadow: "0 0 30px rgba(168,85,247,0.3)", duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 3, delay: delay + 1 });
            gsap.to(tok, { scale: 1.02, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 3, delay: delay + 1 });
          } else if (style === "dark-neon" || style === "tech-glow" || style === "ref-comparison") {
            gsap.to(tok, { boxShadow: "0 0 40px currentColor", duration: 2, ease: "sine.inOut", yoyo: true, repeat: 3, delay: delay + 0.8 });
            gsap.to(tok, { scale: 1.03, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 3, delay: delay + 0.8 });
          }
        }
        // 持续呼吸浮动
        gsap.to(tok, { y: "+=3", duration: 3.5 + i * 0.2, ease: "sine.inOut", yoyo: true, repeat: 3, delay: delay + 0.5 });

        // ═══ premium: 节点光晕逐个点亮 ═══
        if (style === "premium") {
          const glow = document.querySelector(`#nglow-${sceneId}-${i}`);
          if (glow) {
            gsap.set(glow, {
              left: "50%", top: `${40 + i * 12}%`,
              width: 60, height: 30,
              xPercent: -50, yPercent: -50,
              backgroundColor: i === scene.data.tokens.length - 1 ? "#a855f7" : "#6366f1",
            });
            gsap.to(glow, { opacity: 0.12, duration: 1.5, ease: "power2.inOut", delay: delay + 0.3 });
            gsap.to(glow, { scale: 1.2, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 3, delay: delay + 0.8 });
          }
        }
      }
    });

    // ═══ 环绕粒子 - 椭圆轨道缓慢流动 ═══
    for (let i = 0; i < 12; i++) {
      const p = document.querySelector(`#tp-${sceneId}-${i}`);
      if (p) {
        const color = getAccentColor(style, i % 2 === 0 ? "secondary" : "accent");
        gsap.set(p, {
          left: "50%", top: "50%",
          width: 2 + Math.random() * 2,
          height: 2 + Math.random() * 2,
          backgroundColor: color,
          boxShadow: `0 0 4px ${color}80`,
          xPercent: -50, yPercent: -50,
          opacity: 0,
        });
        const rx = 40 + Math.random() * 25;
        const ry = 15 + Math.random() * 10;
        const startAngle = (i / 12) * Math.PI * 2;
        const dur = 5 + Math.random() * 3;
        gsap.to(p, { opacity: 0.4, duration: 1, ease: "power2.inOut", delay: 1.5 + i * 0.1 });
        const angleProxy = { angle: startAngle };
        gsap.to(angleProxy, {
          angle: startAngle + Math.PI * 2,
          duration: dur,
          ease: "none",
          repeat: 2,
          delay: 1.5 + i * 0.1,
          onUpdate: function() {
            const a = angleProxy.angle;
            gsap.set(p, {
              x: Math.cos(a) * rx,
              y: Math.sin(a) * ry,
              scale: 0.4 + (Math.sin(a) + 1) * 0.3,
            });
          }
        });
      }
    }

  } else if (scene.visualType === "code") {
    const sub = document.querySelector(`#sub-${sceneId}`);
    const codeCard = document.querySelector(`#code-${sceneId}`);

    if (sub) {
      gsap.fromTo(sub, { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "power2.inOut", delay: 0.3 });
      gsap.to(sub, { backgroundPosition: "-200% 0%", duration: 4, ease: "sine.inOut", repeat: 3, delay: 1 });
    }
    // ═══ 代码卡片 - 柔和缩放入场 ═══
    if (codeCard) {
      gsap.fromTo(codeCard, { scale: 0.92, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 1.5, ease: "power3.inOut", delay: 0.6 });
      // 持续呼吸
      gsap.to(codeCard, { y: "+=3", duration: 4, ease: "sine.inOut", yoyo: true, repeat: 3, delay: 2 });
    }

    // ═══ 代码行 - 逐步出现 + 清晰节奏 ═══
    scene.data.code.forEach((line, i) => {
      const lineEl = document.querySelector(`#code-line-${sceneId}-${i}`);
      if (lineEl) {
        gsap.fromTo(lineEl,
          { opacity: 0, x: -15, clipPath: "inset(0 100% 0 0)" },
          { opacity: 1, x: 0, clipPath: "inset(0 0% 0 0)", duration: 1, ease: "power2.inOut", delay: 1.2 + i * 0.5 }
        );
      }
    });

    // 光标闪烁 - 柔和
    const cursor = document.querySelector(`#cursor-${sceneId}`);
    if (cursor) {
      const cColor = style === "premium" ? "#818cf8" : style === "tech-glow" ? "#00ff88" : style === "dark-neon" ? "#00d4ff" : "#265cff";
      gsap.set(cursor, { backgroundColor: cColor, boxShadow: `0 0 8px ${cColor}80` });
      gsap.to(cursor, { opacity: 0, duration: 0.6, yoyo: true, repeat: 6, ease: "sine.inOut", delay: 3 });
    }

    // ═══ 扫描光束 - 柔和缓慢 ═══
    const scanBeam = document.querySelector(`#scanbeam-${sceneId}`);
    if (scanBeam) {
      gsap.set(scanBeam, { top: "40%", opacity: 0 });
      gsap.fromTo(scanBeam,
        { top: "42%", opacity: 0 },
        { top: "72%", opacity: 0.4, duration: 4, ease: "sine.inOut", repeat: 2, delay: 1.2 }
      );
    }

  } else if (scene.visualType === "process") {
    const sub = document.querySelector(`#sub-${sceneId}`);
    if (sub) {
      gsap.fromTo(sub, { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "power2.inOut", delay: 0.3 });
      gsap.to(sub, { backgroundPosition: "-200% 0%", duration: 4, ease: "sine.inOut", repeat: 3, delay: 1 });
    }

    scene.data.steps.forEach((_, i) => {
      const step = document.querySelector(`#pstep-${sceneId}-${i}`);
      const label = document.querySelector(`#plabel-${sceneId}-${i}`);
      const arrow = document.querySelector(`#parrow-${sceneId}-${i}`);
      const delay = 0.8 + i * 0.4;

      if (step) {
        // ═══ 柔和缩放入场 - 无旋转 ═══
        gsap.fromTo(step,
          { scale: 0.85, opacity: 0, y: 20 },
          { scale: 1, opacity: 1, y: 0, duration: 1, ease: "power3.inOut", delay }
        );
        // 激活高亮 - 柔和过渡
        gsap.to(step, { className: "+=active", duration: 0.6, ease: "power2.inOut", delay: delay + 0.5 });
        gsap.to(step, { className: "-=active", duration: 0.6, ease: "power2.inOut", delay: delay + 2.5 });
        // 持续呼吸
        gsap.to(step, { y: "+=4", duration: 3.5 + i * 0.2, ease: "sine.inOut", yoyo: true, repeat: 3, delay: delay + 0.8 });

        // 数字跳动 - 柔和
        const countEl = document.querySelector(`#pcount-${sceneId}-${i}`);
        if (countEl) {
          const obj = { val: 0 };
          gsap.to(obj, {
            val: i + 1,
            duration: 1,
            ease: "power2.inOut",
            delay: delay + 0.1,
            onUpdate: function() {
              countEl.textContent = Math.ceil(obj.val);
            }
          });
        }
      }
      if (label) gsap.fromTo(label, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.inOut", delay: delay + 0.3 });
      // ═══ 箭头/连接线 - 沿路径生长 ═══
      if (arrow) {
        gsap.fromTo(arrow, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.8, ease: "power2.inOut", delay: delay + 0.6 });
        gsap.to(arrow, { opacity: 0.4, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 3, delay: delay + 1.2 });
      }
    });

    // ═══ 粒子沿路径流动 ═══
    for (let i = 0; i < 15; i++) {
      const p = document.querySelector(`#pp-${sceneId}-${i}`);
      if (p) {
        const color = getAccentColor(style, i % 3 === 0 ? "primary" : i % 3 === 1 ? "secondary" : "accent");
        gsap.set(p, {
          left: "50%", top: "55%",
          width: 2 + Math.random() * 2,
          height: 2 + Math.random() * 2,
          backgroundColor: color,
          boxShadow: `0 0 ${4 + Math.random()*3}px ${color}80`,
          xPercent: -50, yPercent: -50,
          opacity: 0,
        });
        const angle = (i / 15) * Math.PI * 2 + Math.random() * 0.4;
        const dist = 25 + Math.random() * 60;
        // 柔和扩散 - sine缓动
        gsap.fromTo(p,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 0.5, duration: 0.8, ease: "power2.inOut", delay: 1.5 + i * 0.06 }
        );
        gsap.to(p, {
          x: Math.cos(angle) * dist + "px",
          y: Math.sin(angle) * dist + "px",
          opacity: 0,
          scale: 0.3,
          duration: 2 + Math.random() * 0.8,
          ease: "sine.inOut",
          delay: 1.5 + i * 0.06,
        });
      }
    }
  }

  // 场景解说文字 - 淡入上滑
  const caption = document.querySelector(`#caption-${sceneId}`);
  if (caption) {
    gsap.fromTo(caption,
      { y: 20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power2.out", delay: 1.5 }
    );
  }

  // 引用文献栏 - 淡入
  const refbar = document.querySelector(`#refbar-${sceneId}`);
  if (refbar) {
    gsap.fromTo(refbar,
      { opacity: 0 },
      { opacity: 1, duration: 0.8, ease: "power2.out", delay: 1.8 }
    );
    // 引用标签逐个弹入
    refbar.querySelectorAll('.ref-chip').forEach((chip, i) => {
      gsap.fromTo(chip,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(3)", delay: 2 + i * 0.1 }
      );
    });
  }
}

// ═══ 交互 ═══
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("style-tab")) {
    const sceneId = e.target.closest(".style-tabs").dataset.scene;
    const style = e.target.dataset.style;
    choices[sceneId] = style;
    e.target.closest(".style-tabs").querySelectorAll(".style-tab").forEach(t => t.classList.remove("active"));
    e.target.classList.add("active");
    document.getElementById(`selected-${sceneId}`).textContent = STYLE_NAMES[style];
    renderPreview(sceneId, style);
  }
  if (e.target.classList.contains("replay")) {
    const sceneId = e.target.dataset.scene;
    renderPreview(sceneId, choices[scene.id]);
  }
  if (e.target.closest(".preview-frame")) {
    const frame = e.target.closest(".preview-frame");
    const sceneId = frame.dataset.scene;
    renderPreview(sceneId, choices[sceneId]);
  }
  if (e.target.id === "play-all") {
    SCENES.forEach((scene, i) => {
      setTimeout(() => renderPreview(scene.id, choices[scene.id]), i * 180);
    });
  }
  if (e.target.classList.contains("apply-style")) {
    const style = e.target.dataset.style;
    SCENES.forEach(scene => {
      choices[scene.id] = style;
      const tabs = document.querySelector(`.style-tabs[data-scene="${scene.id}"]`);
      if (tabs) tabs.querySelectorAll(".style-tab").forEach(t => t.classList.toggle("active", t.dataset.style === style));
      document.getElementById(`selected-${scene.id}`).textContent = STYLE_NAMES[style];
      renderPreview(scene.id, style);
    });
  }
  if (e.target.id === "save-btn") {
    const blob = new Blob([JSON.stringify(choices, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "style-choices.json";
    a.click();
    URL.revokeObjectURL(url);
    const result = Object.entries(choices).map(([k, v]) => `${k}: ${STYLE_NAMES[v]}`).join("\n");
    alert("选择已保存！\n\n" + result + "\n\n请将 style-choices.json 发给我");
  }
});

// 初始化 - 错开时间依次播放
SCENES.forEach((scene, i) => {
  setTimeout(() => renderPreview(scene.id, choices[scene.id]), i * 120);
});
</script>
</body>
</html>
